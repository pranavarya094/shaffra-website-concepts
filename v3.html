<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shaffra website concept V3: Minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#1C143C;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5000B8;text-decoration:none}a:hover{color:#794CEC}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6B5FA0}
.accent{background:linear-gradient(100deg,#794CEC 0%,#9747FF 50%,#5000B8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.h2{margin:16px 0 0;font-size:clamp(32px,4vw,52px);line-height:1.08;letter-spacing:-0.035em;font-weight:500}
.lead{margin:18px 0 0;font-size:18px;line-height:1.65;color:#5B5470}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;background:#1C143C;color:#FFFFFF;font:500 15px 'Roboto',sans-serif;border:0;cursor:pointer;transition:background .3s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
.btn:hover{background:#5000B8;color:#FFFFFF;transform:translateY(-1px)}
.btn svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg{transform:translateX(4px)}
.btn-light{background:#FFFFFF;color:#1C143C}
.btn-light:hover{background:#D6ABFE;color:#1C143C}
.link{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#1C143C;font:500 15px 'Roboto',sans-serif}
.link::after{content:'';position:absolute;left:0;right:0;bottom:9px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.link:hover{color:#5000B8}
.link:hover::after{transform:scaleX(1)}
.nav-link{color:#5B5470;font-size:14px;font-weight:500;padding:14px 2px;transition:color .2s ease}
.nav-link:hover{color:#1C143C}
.line{display:block;overflow:hidden}
.line>span{display:block;animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.l2>span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.fade{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.f1{animation-delay:.3s}.f2{animation-delay:.42s}.f3{animation-delay:.6s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.swap{animation:swap .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aurora{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(-40px,0) scale(1)}100%{transform:translate(60px,30px) scale(1.2)}}
.gridbg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#EFEBF8 1px,transparent 1px),linear-gradient(90deg,#EFEBF8 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 0%,transparent 75%)}
.dot{width:7px;height:7px;border-radius:50%;background:#9747FF;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(151,71,255,.5)}50%{box-shadow:0 0 0 6px rgba(151,71,255,0)}}
.marquee{display:flex;gap:64px;width:max-content;animation:marquee 36s linear infinite}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cells{display:grid;gap:1px;background:#ECE8F5;border:1px solid #ECE8F5;border-radius:24px;overflow:hidden}
.cell{background:#FFFFFF;padding:36px;transition:background .35s ease}
.cell:hover{background:#FAF8FE}
.cell .ico{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cell:hover .ico{transform:translateY(-3px)}
.role{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;border-radius:16px;border:0;background:transparent;text-align:left;cursor:pointer;font-family:'Roboto',sans-serif;color:#1C143C;transition:background .25s ease}
.role:hover{background:#FAF8FE}
.role-on{background:#F4F0FC}
.role-on:hover{background:#F4F0FC}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid #ECE8F5;font-size:13px;color:#5B5470;background:#FFFFFF}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(214,171,254,.45);animation:ring 4s ease-out infinite}
.r2{animation-delay:1.3s}.r3{animation-delay:2.6s}
@keyframes ring{0%{transform:scale(.55);opacity:0}25%{opacity:1}100%{transform:scale(1.9);opacity:0}}
.orb{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.faq-q{width:100%;min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;padding:22px 0;text-align:left;font:500 18px 'Roboto',sans-serif;color:#1C143C;cursor:pointer}
.faq-q:hover{color:#5000B8}
.field{width:100%;min-height:50px;padding:0 16px;border-radius:12px;border:1px solid #E2DCF0;background:#FFFFFF;font:400 16px 'Roboto',sans-serif;color:#1C143C;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
.field:focus{border-color:#794CEC;box-shadow:0 0 0 4px rgba(121,76,236,.14)}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#5B5470}
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#794CEC,#9747FF);transform-origin:left;transform:scaleX(0);z-index:60}
@supports (animation-timeline: scroll()){.progress{animation:grow linear both;animation-timeline:scroll(root)}}
@keyframes grow{to{transform:scaleX(1)}}
@supports (animation-timeline: view()){.reveal{animation:fadeUp linear both;animation-timeline:view();animation-range:entry 0% cover 20%}}
@media (max-width:900px){.nav-links{display:none!important}.hide-sm{display:none}.cell{padding:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
<style>
.cx{position:fixed;left:16px;bottom:16px;z-index:70;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid #D6ABFE;box-shadow:0 12px 30px -14px rgba(28,20,60,.6);font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em}
.cx span{padding:0 10px 0 12px;color:#3D3459}
.cx a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;border-radius:999px;color:#1C143C;text-decoration:none}
.cx a:hover{background:#EBE6F6;color:#1C143C}
.cx a.cur{background:#1C143C;color:#FFFFFF}
@media (max-width:600px){.cx span{display:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<nav class="cx" aria-label="Design concepts"><span>CONCEPT</span><a href="./index.html">All</a><a href="./v3.html" class="cur" aria-current="page">V3</a><a href="./v4.html">V4</a><a href="./v5.html">V5</a></nav>
<template id="dc-tpl">


<div style="width: 100%; overflow: hidden; background: #FFFFFF">
<div class="progress" aria-hidden="true"></div>

<!-- NAV -->
<header style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid #F1EDF9">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<a href="#top" aria-label="Shaffra home" style="font-size: 24px; font-weight: 600; letter-spacing: -0.04em; color: #1C143C">shaffra</a>
<nav class="nav-links" aria-label="Main" style="display: flex; gap: 32px; align-items: center">
<a class="nav-link" href="#employees">AI employees</a>
<a class="nav-link" href="#platform">Platform</a>
<a class="nav-link" href="#talk">Shaffra Talk</a>
<a class="nav-link" href="#results">Results</a>
<a class="nav-link" href="#deploy">Deployment</a>
</nav>
<div style="display: flex; gap: 20px; align-items: center">

</div>
</div>

<!-- HERO -->
<section id="top" style="position: relative; padding: 104px 0 88px; text-align: center">
<div class="gridbg" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true" style="width: 620px; height: 420px; background: #D6ABFE; opacity: .45; top: -140px; left: 50%; margin-left: -310px"></div>
<div style="position: relative; max-width: 980px; margin: 0 auto; padding: 0 24px">
<div class="fade" style="display: inline-flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #ECE8F5; background: rgba(255,255,255,.7)">
<span class="dot"></span>
<span class="eyebrow" style="font-size: 11px">35+ AI employees live across the GCC</span>
</div>
<h1 style="margin: 28px 0 0; font-size: clamp(34px, 6.4vw, 92px); line-height: 1.04; letter-spacing: -0.045em; font-weight: 500">
<span class="line"><span>AI employees that</span></span>
<span class="line l2"><span>
<span style="display: block; height: 1.16em; overflow: hidden">
<span style="display: block; transform: {{wordShift}}; transition: transform .8s cubic-bezier(.65,0,.2,1)">
<sc-for list="{{words}}" as="w" hint-placeholder-count="4">
<span class="accent" style="display: block; height: 1.16em; line-height: 1.16em; white-space: nowrap">{{w}}</span>
</sc-for>
</span>
</span>
</span></span>
</h1>
<p class="fade f1" style="margin: 26px auto 0; max-width: 620px; font-size: 19px; line-height: 1.6; color: #5B5470">Shaffra builds, deploys and governs autonomous AI employees for enterprise and government. In Arabic and English, inside your own systems and security perimeter.</p>
<div class="fade f2" style="margin-top: 36px; display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: center; align-items: center">
<a class="btn" href="#demo">Book a demo
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<a class="link" href="#employees">Meet the AI employees</a>
</div>
</div>

<!-- live work panel -->
<div class="fade f3" style="position: relative; max-width: 860px; margin: 72px auto 0; padding: 0 24px; text-align: left">
<div style="border: 1px solid #ECE8F5; border-radius: 24px; background: rgba(255,255,255,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 50px 100px -60px rgba(80,0,184,.45); overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #F1EDF9">
<span class="mono" style="font-size: 12px; letter-spacing: .08em; color: #5B5470">SHAFFRA WORK</span>
<span class="mono" style="display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .1em; color: #5000B8"><span class="dot"></span>LIVE</span>
</div>
<sc-for list="{{feed}}" as="r" hint-placeholder-count="4">
<div style="position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #F6F3FB">
<span style="flex: none; width: 38px; height: 38px; border-radius: 12px; background: #F4F0FC; color: #5000B8; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">{{r.i}}</span>
<span style="flex: 1 1 auto; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.task}}</span>

</div>
</sc-for>
<div style="padding: 14px 24px; display: flex; justify-content: space-between; gap: 12px">
<span style="font-size: 13px; color: #5B5470">Every action permissioned and logged</span>
<span class="mono" style="font-size: 11px; letter-spacing: .08em; color: #6B5FA0">ILLUSTRATIVE</span>
</div>
</div>
</div>
</section>

<!-- SECTORS -->
<section aria-label="Sectors" style="padding: 30px 0; border-top: 1px solid #F1EDF9; border-bottom: 1px solid #F1EDF9; overflow: hidden">
<div style="overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent)">
<div class="marquee">
<sc-for list="{{sectors}}" as="s" hint-placeholder-count="16">
<span class="mono" style="font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6B5FA0; white-space: nowrap">{{s}}</span>
</sc-for>
</div>
</div>
</section>

<!-- WHAT WE DO -->
<section style="padding: 128px 0 0">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 24px">
<div class="reveal" style="max-width: 820px">
<span class="eyebrow">What we do</span>
<h2 class="h2">You describe the work. We deploy an AI team that <span class="accent">does it.</span></h2>
</div>
<div class="cells reveal" style="margin-top: 56px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr))">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<div class="cell">
<span class="mono" style="font-size: 12px; letter-spacing: .1em; color: #794CEC">{{st.n}}</span>
<h3 style="margin: 56px 0 0; font-size: 24px; letter-spacing: -0.025em; font-weight: 500">{{st.t}}</h3>
<p style="margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #5B5470">{{st.d}}</p>
</div>
</sc-for>
</div>
</div>
</section>

<!-- AI EMPLOYEES -->
<section id="employees" style="padding: 128px 0 0">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 24px">
<div class="reveal" style="max-width: 820px">
<span class="eyebrow">AI employees</span>
<h2 class="h2">Already trained. Already working.</h2>
<p class="lead" style="max-width: 600px">Each AI employee has a role, memory, judgment and a clear job description. Pick one to see what they do.</p>
</div>
<div class="reveal" style="margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px; align-items: start">
<div role="tablist" aria-label="AI employees" style="display: flex; flex-direction: column; gap: 4px">

<span>
<span style="display: block; font-size: 17px; font-weight: 500">{{p.n}}</span>
<span style="display: block; font-size: 13px; color: #5B5470">{{p.r}}</span>
</span>
</span>
<span class="mono" style="font-size: 11px; letter-spacing: .08em; color: #6B5FA0">{{p.team}}</span>
</button>
</sc-for>
</div>
<div style="border: 1px solid #ECE8F5; border-radius: 24px; padding: 40px; background: linear-gradient(165deg, #FFFFFF 0%, #FAF8FE 100%); min-height: 420px">
<sc-for list="{{current}}" as="c" hint-placeholder-count="1">

<span class="mono" style="font-size: 12px; letter-spacing: .1em; color: #794CEC">{{c.teamLong}}</span>
<h3 style="margin: 18px 0 0; font-size: clamp(26px, 2.8vw, 36px); line-height: 1.15; letter-spacing: -0.03em; font-weight: 500">{{c.h}}</h3>
<p style="margin: 16px 0 0; font-size: 17px; line-height: 1.65; color: #5B5470">{{c.d}}</p>

<sc-for list="{{c.pts}}" as="pt" hint-placeholder-count="3">

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#794CEC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg>{{pt}}
</div>
</sc-for>
</div>
<a class="link" href="#demo" style="margin-top: 28px; color: #5000B8">See {{c.n}} in a live demo
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>
</sc-for>
</div>
</div>
<div class="reveal" style="margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-size: 14px; color: #5B5470; margin-right: 6px">Also on the roster</span>
<sc-for list="{{roster}}" as="ro" hint-placeholder-count="7"><span class="chip">{{ro}}</span></sc-for>
</div>
</div>
</section>

<!-- PLATFORM -->

</div>

<!-- SHAFFRA TALK -->
<section id="talk" style="padding: 128px 0 0">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 64px; align-items: center">
<div class="reveal">
<span class="eyebrow">Shaffra Talk</span>
<h2 class="h2">Talk to your AI team. <span class="accent">Face to face.</span></h2>

schedule(){if(this.q)return;this.q=true;requestAnimationFrame(()=>{this.q=false;this.render();});},
render(){const box=document.createElement('div');this.build(this.tpl,box,[this.c.renderVals()]);this.morph(this.root,box);},
get(path,sc){path=path.trim();if(path==='true')return true;if(path==='false')return false;const ps=path.split('.');let v;for(const s of sc){if(s&&Object.prototype.hasOwnProperty.call(s,ps[0])){v=s[ps[0]];break;}}for(let i=1;i<ps.length&&v!=null;i++)v=v[ps[i]];return v;},
val(str,sc){const m=/^\s*\{\{([^}]+)\}\}\s*$/.exec(str);if(m)return this.get(m[1],sc);return str.replace(/\{\{([^}]+)\}\}/g,(_, p)=>{const v=this.get(p,sc);return v==null?'':String(v);});},

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { w: 0, step: 0, who: 'omar', faq: 0, sent: false, p: 1 };
  }
  componentDidMount() {
    this.wordTimer = setInterval(() => this.setState({ w: (this.state.w + 1) % 4 }), 2400);
    this.feedTimer = setInterval(() => this.setState({ step: (this.state.step + 1) % 7 }), 1400);
    try {
      const el = document.getElementById('v3-proof');
      if (el && 'IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && !this.counted) {
            this.counted = true;
            this.runCount();
          }
        }, { threshold: 0.3 });
        this.io.observe(el);
      }
    } catch (e) {}
  }
  componentWillUnmount() {
    clearInterval(this.wordTimer);
    clearInterval(this.feedTimer);
    if (this.io) this.io.disconnect();
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  runCount() {
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / 1600);
      this.setState({ p: 1 - Math.pow(1 - t, 3) });
      if (t < 1) this.raf = requestAnimationFrame(tick);
    };
    this.setState({ p: 0 });
    this.raf = requestAnimationFrame(tick);
  }

      { id: 'yara', n: 'Yara', r: 'PMO Lead', team: 'PROJECTS', teamLong: 'PROJECT MANAGEMENT TEAM · 8+ AI AGENTS', h: 'Yara keeps the whole portfolio on track.', d: 'She oversees plans, reporting and priorities across your projects, around the clock.', pts: ['Portfolio planning', 'Status reporting', 'Priority management'] },

    ];

      return {
        n: x.n, r: x.r, team: x.team, i: x.n.charAt(0),

    }));
