<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#1C143C;background:#EBE6F6;-webkit-font-smoothing:antialiased}
a{color:#5000B8;text-decoration:none}a:hover{color:#794CEC}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.label{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5A4A8A}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}.s1{grid-column:span 1}.r2{grid-row:span 2}
.card{background:#FFFFFF;border-radius:32px;padding:32px;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 30px 60px -34px rgba(80,0,184,.45)}
.deep{background:linear-gradient(165deg,#794CEC 0%,#5000B8 55%,#2C1454 100%);color:#FFFFFF}
.ink{background:#1C143C;color:#FFFFFF}
.h{margin:0;font-weight:900;letter-spacing:-0.035em;line-height:1.02}
.soft{color:#8464CC}
.p{margin:0;font-size:16px;line-height:1.6;color:#4A4166}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;background:#1C143C;color:#FFFFFF;font:700 16px 'Roboto',sans-serif;border:0;cursor:pointer;transition:background .3s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
.btn:hover{background:#5000B8;color:#FFFFFF;transform:scale(1.03)}
.btn-v{background:#794CEC}
.btn-v:hover{background:#FFFFFF;color:#1C143C}
.btn-o{background:transparent;color:#1C143C;border:2px solid #1C143C}
.btn-o:hover{background:#1C143C;color:#FFFFFF}
.in{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
.i1{animation-delay:.1s}.i2{animation-delay:.22s}.i3{animation-delay:.34s}
@keyframes in{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ask{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes answer{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.q{animation:ask linear both;animation-timeline:view();animation-range:entry 0% cover 18%}
.a{animation:answer linear both;animation-timeline:view();animation-range:entry 0% cover 20%}
}
.q{display:flex;justify-content:flex-end;margin:0 0 28px}
.q>span{display:inline-block;max-width:720px;padding:22px 30px;border-radius:32px 32px 8px 32px;background:#1C143C;color:#FFFFFF;font-size:clamp(22px,2.8vw,34px);font-weight:700;letter-spacing:-0.025em;line-height:1.2}
.from{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.dot{width:8px;height:8px;border-radius:50%;background:#9747FF;animation:ping 1.8s ease-in-out infinite}
@keyframes ping{0%,100%{box-shadow:0 0 0 0 rgba(151,71,255,.55)}50%{box-shadow:0 0 0 7px rgba(151,71,255,0)}}
.bar{width:4px;border-radius:4px;background:#D6ABFE;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.off{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.on{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
.agent .av{transition:transform .5s cubic-bezier(.2,.7,.2,1),background .4s ease}
.agent:hover .av{transform:rotate(-8deg) scale(1.1);background:#794CEC;color:#FFFFFF}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:999px;background:#F4F2FA;font-size:14px;font-weight:500;color:#3D3459}
.chip-d{background:rgba(255,255,255,.14);color:#FFFFFF}
.orb{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.field{width:100%;min-height:52px;padding:0 18px;border-radius:16px;border:2px solid #E6DEF6;background:#FFFFFF;font:400 16px 'Roboto',sans-serif;color:#1C143C;outline:none;transition:border-color .2s ease}
.field:focus{border-color:#794CEC}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#3D3459}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(28,20,60,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -20px rgba(28,20,60,.7);animation:dock .9s cubic-bezier(.2,.7,.2,1) .8s both}
@keyframes dock{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
.dock a.dl{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;color:#E6DEF6;font-size:14px;font-weight:500;white-space:nowrap;transition:background .25s ease}
.dock a.dl:hover{background:rgba(255,255,255,.12);color:#FFFFFF}
@media (max-width:900px){.bento{grid-template-columns:1fr}.bento>*{grid-column:auto!important;grid-row:auto!important}.dock a.dl{display:none}.card{padding:26px;border-radius:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
<style>
.cx{position:fixed;left:16px;bottom:16px;z-index:70;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid #D6ABFE;box-shadow:0 12px 30px -14px rgba(28,20,60,.6);font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em}
.cx span{padding:0 10px 0 12px;color:#3D3459}
.cx a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;border-radius:999px;color:#1C143C;text-decoration:none}
.cx a:hover{background:#EBE6F6;color:#1C143C}
.cx a.cur{background:#1C143C;color:#FFFFFF}
@media (max-width:600px){.cx span{display:none}}
</style>
</head>

<script>
class DCLogic{constructor(p){this.props=p||{};this.state={};}
setState(u){Object.assign(this.state,typeof u==='function'?u(this.state):u);DC.schedule();}
forceUpdate(){DC.schedule();}}
const DC={q:false,
mount(C){this.c=new C({});this.tpl=document.getElementById('dc-tpl').content;this.root=document.getElementById('dc-root');this.render();if(this.c.componentDidMount)this.c.componentDidMount();},
schedule(){if(this.q)return;this.q=true;requestAnimationFrame(()=>{this.q=false;this.render();});},
render(){const box=document.createElement('div');this.build(this.tpl,box,[this.c.renderVals()]);this.morph(this.root,box);},
get(path,sc){path=path.trim();if(path==='true')return true;if(path==='false')return false;const ps=path.split('.');let v;for(const s of sc){if(s&&Object.prototype.hasOwnProperty.call(s,ps[0])){v=s[ps[0]];break;}}for(let i=1;i<ps.length&&v!=null;i++)v=v[ps[i]];return v;},
val(str,sc){const m=/^\s*\{\{([^}]+)\}\}\s*$/.exec(str);if(m)return this.get(m[1],sc);return str.replace(/\{\{([^}]+)\}\}/g,(_, p)=>{const v=this.get(p,sc);return v==null?'':String(v);});},
bind(el,type){el.__l=el.__l||{};if(el.__l[type])return;el.__l[type]=true;el.addEventListener(type,(e)=>{const h=el.__h&&el.__h[type];if(h)h(e);});},
build(src,out,sc){for(const n of src.childNodes){if(n.nodeType===3){out.appendChild(document.createTextNode(this.val(n.data,sc)));continue;}if(n.nodeType!==1)continue;const tag=n.localName;
if(tag==='sc-for'){const list=this.val(n.getAttribute('list'),sc)||[];const as=n.getAttribute('as');list.forEach((it,i)=>this.build(n,out,[{[as]:it,$index:i}].concat(sc)));continue;}
if(tag==='sc-if'){if(this.val(n.getAttribute('value'),sc))this.build(n,out,sc);continue;}
const el=document.createElementNS(n.namespaceURI,tag);
for(const a of n.attributes){if(a.name.indexOf('hint-')===0)continue;const v=this.val(a.value,sc);if(/^on[a-z]/i.test(a.name)&&typeof v==='function'){const t=a.name.slice(2).toLowerCase();el.__h=el.__h||{};el.__h[t]=v;this.bind(el,t);continue;}if(v==null||typeof v==='function')continue;el.setAttribute(a.name,String(v));}
this.build(n,el,sc);out.appendChild(el);}},
morph(o,n){const oc=Array.from(o.childNodes),nc=Array.from(n.childNodes);const len=Math.max(oc.length,nc.length);for(let i=0;i<len;i++){const a=oc[i],b=nc[i];if(!a){o.appendChild(b);continue;}if(!b){o.removeChild(a);continue;}if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){o.replaceChild(b,a);continue;}if(a.nodeType===3){if(a.data!==b.data)a.data=b.data;continue;}
for(const at of Array.from(a.attributes)){if(!b.hasAttribute(at.name))a.removeAttribute(at.name);}
for(const at of b.attributes){if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
if(b.__h){a.__h=Object.assign(a.__h||{},b.__h);for(const t in b.__h)this.bind(a,t);}
this.morph(a,b);}}};

</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, sent: false, p: 1 };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ step: (this.state.step + 1) % 8 }), 1300);
    try {
      const el = document.getElementById('v5-proof');
      if (el && 'IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && !this.counted) {
            this.counted = true;
            this.runCount();
          }
        }, { threshold: 0.3 });
        this.io.observe(el);
      }
    } catch (e) {}
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    if (this.io) this.io.disconnect();
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  runCount() {
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / 1700);
      this.setState({ p: 1 - Math.pow(1 - t, 3) });
      if (t < 1) this.raf = requestAnimationFrame(tick);
    };
    this.setState({ p: 0 });
    this.raf = requestAnimationFrame(tick);
  }

      lines: script.map((l, i) => ({ ...l, cls: st.step > i ? 'on' : 'off' })),
      layers: [
        { t: 'Shaffra Work', d: 'One workspace for people and AI employees, with quality checks on every conversation.', icon: 'M3 7h18M3 12h18M3 17h12' },

        { t: 'Shaffra Build', d: 'Set personality, voice, avatar, permissions and knowledge. Deploy in minutes.', icon: 'M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4' },
        { t: 'Governance', d: 'Role-based access, policies, audit logs and versioned rollback for every AI employee.', icon: 'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z' }
      ],
      agents: [
        { n: 'Omar', i: 'O', team: 'Call center', r: 'Call Center Agent', d: 'Answers calls in Arabic or English with full customer context, then closes the ticket.' },
        { n: 'Lina', i: 'L', team: 'HR', r: 'Recruiter', d: 'Publishes job ads, sources talent and screens every applicant.' },

        { n: 'Mohammed', i: 'M', team: 'HR', r: 'Functional Evaluator', d: 'Assesses role readiness against competencies and simulated tasks.' },
        { n: 'Yara', i: 'Y', team: 'Projects', r: 'PMO Lead', d: 'Oversees plans, reporting and priorities across the portfolio.' },
        { n: 'Ahmad', i: 'A', team: 'Projects', r: 'Project Manager', d: 'Runs daily planning and follow-ups, and resolves blockers.' }
      ],
      more: ['Sales Agent', 'VP Sales', 'Investor Relations', 'Airport Assistant', 'Personal Enabler', 'Performance Evaluator'],
      dialects: ['Khaleeji', 'Najdi', 'Hijazi', 'Egyptian', 'MSA', 'English'],
      tech: [
        { k: 'SHAFFRA-TTS-2', d: '50+ voices, trained deeply on Gulf Arabic and MSA.' },
        { k: 'SHAFFRA-STT-2', d: 'Real-time transcription in 60+ languages.' },

      ],

</script>
